<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TickerTV key test</title>
<style>
  body { background:#000; color:#eee; font:28px/1.4 -apple-system, sans-serif; margin:48px; }
  #count { font-size:120px; font-weight:200; }
  #last { font-size:48px; color:#4ade80; }
  #log { font:22px monospace; color:#999; white-space:pre; }
</style>
</head>
<body>
<div>presses: <span id="count">0</span></div>
<div id="last">press a key</div>
<div id="log"></div>
<script>
  var n = 0, lines = [];
  function log(msg) {
    n++;
    document.getElementById('count').textContent = n;
    document.getElementById('last').textContent = msg;
    lines.unshift(n + '  ' + msg);
    document.getElementById('log').textContent = lines.slice(0, 12).join('\n');
    console.info('[keytest] ' + n + ' ' + msg);
  }
  // Keep focus on the page and stop spatial navigation from moving it.
  window.addEventListener('keydown', function (e) {
    log('keydown key=' + e.key + ' code=' + e.keyCode + (e.repeat ? ' (repeat)' : ''));
    e.preventDefault();
  }, true);
  // Alexa / remote media commands arrive through the Media Session API.
  if ('mediaSession' in navigator) {
    ['play', 'pause', 'nexttrack', 'previoustrack', 'seekforward', 'seekbackward', 'stop'].forEach(function (a) {
      try { navigator.mediaSession.setActionHandler(a, function () { log('mediaSession ' + a); }); }
      catch (err) { console.info('[keytest] no handler for ' + a); }
    });
    console.info('[keytest] mediaSession handlers set');
  } else {
    console.info('[keytest] no mediaSession');
  }
  console.info('[keytest] ready');
</script>
</body>
</html>
